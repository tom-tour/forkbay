[package]
name = "switch-2-manager"
version = "0.4.0"
edition = "2021"
description = "One window for Switch 2 emulators: launch, update, share data, Steam and cloud saves"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-tour/switch-2-manager"

[[bin]]
name = "switch-2-manager"
path = "src/main.rs"

[dependencies]
wry = { version = "0.57", features = ["linux-body"] }
tao = "0.37"
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
