[package]
name = "nx2-launcher"
version = "0.16.0"
edition = "2021"
description = "Switch 2 emulator manager: launch, update, share data, Steam and cloud saves"
license = "GPL-3.0-or-later"
repository = "https://github.com/tom-tour/nx2-launcher"

[[bin]]
name = "nx2-launcher"
path = "src/main.rs"

[dependencies]
wry = { version = "0.57", features = ["linux-body"] }
tao = "0.37"
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
# Controllers, seen exactly as the emulators see them: they are built with this same SDL release.
sdl3-sys = { version = "=0.6.8", default-features = false, features = ["build-from-source-static", "no-default-subsystems", "sdl-joystick", "sdl-hidapi", "sdl-haptic", "sdl-sensor", "sdl-unix-console-build"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_System_Time", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
# UI Automation, to press a button of the emulator's own settings window (already built for the web view).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "linux")'.dependencies]
png = "0.18"

[build-dependencies]
embed-resource = "3"
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
