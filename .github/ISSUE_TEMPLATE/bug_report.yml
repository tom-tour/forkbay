name: Bug report
description: A problem with the tool itself. Use its Report a bug page, which fills this in for you.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This is for bugs in the manager: setup, import, updates, Steam, cloud saves, its window.
        A crash or a graphics problem **inside a game** comes from the emulator: please look at that emulator's own project instead. We cannot fix those here.
        Please do not attach keys, firmware or game files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Games page
        2. Click Play on ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Generated by the tool, without paths, names or keys. Attach bug-report.txt below if it was cut.
      render: text
    validations:
      required: false
