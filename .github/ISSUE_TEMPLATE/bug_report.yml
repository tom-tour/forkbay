name: Bug report
description: Report a problem with Switch 2 Manager. Use the Report a bug page of the tool, it fills this in for you.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach keys, firmware or game files. Problems inside a game usually belong to the emulator, but they are welcome here if you are unsure.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Games page
        2. Click Play on ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Generated by the tool, without paths, names or keys. Attach bug-report.txt below if it was cut.
      render: text
    validations:
      required: false
