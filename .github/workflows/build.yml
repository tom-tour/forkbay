name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build without local paths inside the program
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE\.cargo=/cargo --remap-path-prefix=$env:USERPROFILE\.rustup=/rustup --remap-path-prefix=$env:GITHUB_WORKSPACE=/src"
          cargo build --release --locked
      - run: Copy-Item target/release/switch-2-manager.exe switch-2-manager-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: switch-2-manager-windows
          path: switch-2-manager-windows-x86_64.exe

  linux:
    # Built on an older Ubuntu so that it runs on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build without local paths inside the program
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          cargo build --release --locked
      - name: Test the app on a virtual screen
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils dbus
          bash ci/run-linux.sh target/release/switch-2-manager screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: screenshots
      - name: Package
        run: |
          mkdir -p dist/switch-2-manager
          cp target/release/switch-2-manager README.md LICENSE dist/switch-2-manager/
          tar -C dist -czf switch-2-manager-linux-x86_64.tar.gz switch-2-manager
          cp target/release/switch-2-manager switch-2-manager-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: switch-2-manager-linux
          path: |
            switch-2-manager-linux-x86_64
            switch-2-manager-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: switch-2-manager-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Switch 2 Manager ${GITHUB_REF_NAME#v}" --generate-notes
          fi
