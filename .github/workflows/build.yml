name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build without local paths inside the program
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE\.cargo=/cargo --remap-path-prefix=$env:USERPROFILE\.rustup=/rustup --remap-path-prefix=$env:GITHUB_WORKSPACE=/src"
          cargo build --release --locked
      - name: Test the app
        shell: pwsh
        run: ./ci/run-windows.ps1 -Bin target/release/forkbay.exe
      - run: Copy-Item target/release/forkbay.exe forkbay-windows-x86_64.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forkbay-windows
          path: forkbay-windows-x86_64.exe

  linux:
    # Built on an older Ubuntu so that it runs on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build without local paths inside the program
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          cargo build --release --locked
      - name: Test the app on a virtual screen
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils dbus
          bash ci/run-linux.sh target/release/forkbay screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots-linux
          path: screenshots
      - name: Package
        run: |
          mkdir -p dist/forkbay
          cp target/release/forkbay README.md LICENSE dist/forkbay/
          tar -C dist -czf forkbay-linux-x86_64.tar.gz forkbay
          cp target/release/forkbay forkbay-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forkbay-linux
          path: |
            forkbay-linux-x86_64
            forkbay-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: forkbay-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Forkbay ${GITHUB_REF_NAME#v}" --generate-notes
          fi
