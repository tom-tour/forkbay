name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable --no-self-update && rustup default stable
      # No path remapping here: these are the runner's paths, and remapped builds were flagged far more often by Defender.
      - run: cargo build --release --locked
      - run: cargo test --release --locked
      - name: Test the app
        shell: pwsh
        run: ./ci/run-windows.ps1 -Bin target/release/nx2-launcher.exe
      # The forkbay- copy is what versions from before the new name look for when they update.
      - run: |
          Copy-Item target/release/nx2-launcher.exe nx2-launcher-windows-x86_64.exe
          Copy-Item target/release/nx2-launcher.exe forkbay-windows-x86_64.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows
          path: |
            nx2-launcher-windows-x86_64.exe
            forkbay-windows-x86_64.exe

  linux:
    # Built on an older Ubuntu so that it runs on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libudev-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - name: Build without local paths inside the program
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$HOME/.rustup=/rustup --remap-path-prefix=$GITHUB_WORKSPACE=/src"
          # The same for the C code of SDL.
          export CFLAGS="-ffile-prefix-map=$HOME/.cargo=/cargo -ffile-prefix-map=$GITHUB_WORKSPACE=/src -ffile-prefix-map=$HOME=/home"
          cargo build --release --locked
          cargo test --release --locked
      - name: Test the app on a virtual screen
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils dbus
          bash ci/run-linux.sh target/release/nx2-launcher screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots-linux
          path: screenshots
      - name: Package
        run: |
          mkdir -p dist/nx2-launcher
          cp target/release/nx2-launcher README.md LICENSE dist/nx2-launcher/
          tar -C dist -czf nx2-launcher-linux-x86_64.tar.gz nx2-launcher
          cp target/release/nx2-launcher nx2-launcher-linux-x86_64
          # What versions from before the new name look for when they update.
          cp target/release/nx2-launcher forkbay-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-linux
          path: |
            nx2-launcher-linux-x86_64
            nx2-launcher-linux-x86_64.tar.gz
            forkbay-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: build-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NX2 Launcher ${GITHUB_REF_NAME#v}" --generate-notes
          fi
