name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo build --release --locked
      - run: Copy-Item target/release/switch-2-manager.exe "Switch 2 Manager.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-2-manager-windows
          path: Switch 2 Manager.exe

  linux:
    # Built on an older Ubuntu so that it runs on newer distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo build --release --locked
      - name: Test the app on a virtual screen
        run: |
          sudo apt-get install -y xvfb imagemagick x11-utils dbus
          bash ci/run-linux.sh target/release/switch-2-manager screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-linux
          path: screenshots
      - name: Package
        run: |
          mkdir -p dist/switch-2-manager
          cp target/release/switch-2-manager README.md LICENSE dist/switch-2-manager/
          tar -C dist -czf switch-2-manager-linux-x86_64.tar.gz switch-2-manager
      - uses: actions/upload-artifact@v4
        with:
          name: switch-2-manager-linux
          path: switch-2-manager-linux-x86_64.tar.gz
